---
layout: home
# Index page
---

{% assign latest_post = site.posts.first %}
{% if latest_post %}
<div class="latest-post mb-5">
  <h2><a href="{{ latest_post.url | relative_url }}">{{ latest_post.title }}</a></h2>
  <div class="post-content mt-3">
    {{ latest_post.content }}
  </div>
</div>
<hr>
{% endif %}
