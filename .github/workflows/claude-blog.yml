name: Claude Blog Optimizer

on:
  pull_request:
    branches: [main]

jobs:
  optimize-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Run Claude on changed posts
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are a Jekyll blog SEO and content optimizer.

            Look at the files changed in this pull request under _posts/.

            For each changed post file:
            1. Read the file contents
            2. Analyze the post content carefully
            3. Update ONLY the Jekyll front matter (the --- block at the top) with:
               - `categories`: 1-3 broad categories as a YAML list
               - `tags`: 5-10 specific tags as a YAML list relevant to the content
               - `description`: A compelling 150-160 character meta description for SEO
               - `title`: Improve for SEO only if vague, otherwise leave it
               - Do NOT add or remove any other front matter fields
            4. Write the updated file back, preserving ALL post content exactly as-is

            Rules:
            - Only modify the front matter, never the post body
            - Tags should be lowercase, hyphenated (e.g. machine-learning)
            - Categories should be broad; tags should be specific
            - Commit your changes directly to this PR branch
