name: Claude Blog Optimizer

on:
  pull_request:
    branches: [main]

jobs:
  optimize-post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Run Claude on changed posts
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are a Jekyll blog SEO and content optimizer.

            Look at the files under _posts/.

            For each changed post file, analyze the content and post a PR comment with suggested front matter improvements including:
            - `categories`: 1-3 broad categories as a YAML list
            - `tags`: 5-10 specific lowercase hyphenated tags
            - `description`: A compelling 150-160 character meta description for SEO
            - `title`: Improved title if the current one is vague

            Format your suggestions as a ready-to-copy front matter block.
            Do NOT edit any files directly.
